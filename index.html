<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="

    style-src 'self';
    img-src 'self' data:;

    base-uri 'self';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PUBG Ban Checker</title>
  <meta name="description" content="Check current PUBG account ban signals by player name and platform, and track observed changes with a personal watchlist." />
  <link rel="canonical" href="https://pubgbanchecker.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="PUBG Ban Checker" />
  <meta property="og:description" content="Check PUBG account ban signals and monitor observed status changes." />
  <meta property="og:url" content="https://pubgbanchecker.com/" />
  <meta name="twitter:card" content="summary" />
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"PUBG Ban Checker","url":"https://pubgbanchecker.com/","applicationCategory":"UtilityApplication","operatingSystem":"Any","description":"Check PUBG account ban signals and monitor observed status changes."}</script>
<link rel="preload" href="css/command-center.css?v=20260828a" as="style" />
<link rel="stylesheet" href="css/lang.css" />
<link rel="preload" href="img/steam.svg" as="image" type="image/svg+xml" />
<link rel="preload" href="img/xbox.svg" as="image" type="image/svg+xml" />
<link rel="preload" href="img/psn.svg" as="image" type="image/svg+xml" />
<link rel="preload" href="img/kakao.svg" as="image" type="image/svg+xml" />
  <link rel="stylesheet" href="css/command-center.css?v=20260828a" />
  <link rel="stylesheet" href="css/index-page.css?v=20260828a" />
  <script src="js/theme.js?v=20260827b"></script>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/site-layout.css?v=20260827b">
  <script defer src="js/ban-card.js?v=20260912b"></script>
  <script defer src="js/watchlist-store.js?v=20260827c"></script>
  <script defer src="js/main.js?v=20260910b"></script>
  <script defer src="js/i18n.js?v=20251228"></script>
</head>
<body>
  <h1 class="visually-hidden">PUBG Ban Checker</h1>

  <div class="nav-panel">
    <div class="nav-title" data-i18n="hero.index.title">PUBG BAN CHECKER</div>
    <div class="nav-panel-buttons">
      <a class="nav-button" href="index.html" aria-current="page" data-i18n="nav.ban">Ban Checker</a>
      <a class="nav-button" href="watchlist.html" data-i18n="nav.watchlist">Watchlist</a>
      <a class="nav-button" href="links.html" data-i18n="nav.links">Links</a>
      <a class="nav-button" href="updates.html" data-i18n="nav.about">About</a>
      <a class="nav-button" href="games.html" data-i18n="nav.games">Games</a>
    </div>
    <div class="theme-switcher">
      <button class="theme-swatch" data-theme="cyber" title="Cyber Blue"></button>
      <button class="theme-swatch" data-theme="red" title="Blood Red"></button>
      <button class="theme-swatch" data-theme="green" title="Toxic"></button>
      <button class="theme-swatch" data-theme="phantom" title="Phantom"></button>
      <button class="theme-swatch" data-theme="gold" title="Solar Gold"></button>
      <button class="theme-swatch" data-theme="void" title="Void"></button>
      <button class="theme-swatch" data-theme="ember" title="Ember"></button>
      <button class="theme-swatch" data-theme="synthwave" title="Synthwave"></button>
      <button class="theme-swatch" data-theme="arctic" title="Arctic"></button>
      <button class="theme-swatch" data-theme="orange" title="Toxic Orange"></button>
    </div>
    <div class="lang-switch">
      <label for="langSelect" data-i18n="nav.lang">Language</label>
      <select id="langSelect"></select>
    </div>
  </div>

  <!-- =======================================================
       Platform Selection (with shimmer + active label)
       ======================================================= -->
  <section class="container platform-box">
    <h2 data-i18n="hero.index.platform">Select Platform</h2>

    <div id="platformRowIndex" class="platform-row" role="group">
      <button class="platform-btn steam" data-platform="steam" data-tooltip="Steam">
        <img src="img/steam.svg" alt="Steam" class="platform-icon" />
      </button>
      <button class="platform-btn xbox" data-platform="xbox" data-tooltip="Xbox">
        <img src="img/xbox.svg" alt="Xbox" class="platform-icon" />
      </button>
      <button class="platform-btn psn" data-platform="psn" data-tooltip="PlayStation Network">
        <img src="img/psn.svg" alt="PSN" class="platform-icon" />
      </button>
      <button class="platform-btn kakao" data-platform="kakao" data-tooltip="Kakao">
        <img src="img/kakao.svg" alt="Kakao" class="platform-icon" />
      </button>
    </div>

    <!-- Active platform label -->
    <p id="activePlatformLabel" class="active-platform-label">
      Currently searching: <strong>Steam</strong>
    </p>

    <input type="hidden" id="platformSelect" value="steam" />
  </section>

  <!-- Ban & Clan Checker -->
  <section class="container">
    <h2 data-i18n="hero.index.banchecker">Ban &amp; Clan Checker</h2>

    <textarea
      id="playerInput"
      data-i18n-placeholder="hero.index.placeholder"
      placeholder="Enter player names, separated by commas or new lines (max 10 per check)"
    ></textarea>

    <div class="control-buttons">
      <button id="checkBanBtn" type="button" data-i18n="hero.index.check">Check</button>
      <button id="clearResultsBtn" class="secondary-btn" type="button" data-i18n="hero.index.clear">Clear</button>
    </div>

    <div id="results"><p class="muted" data-i18n="common.noresults">No results yet.</p></div>
  </section>

  <!-- Search by Account ID -->
  <section class="container">
    <h2 data-i18n="hero.index.searchid">Search by Account ID</h2>
    <input id="accountIdInput" class="text-input" data-i18n-placeholder="hero.index.searchid" placeholder="Enter PUBG Account ID" />

    <div class="control-buttons">
      <button id="lookupIdBtn" type="button" data-i18n="hero.index.lookup">Lookup ID</button>
      <button id="clearIdBtn" class="secondary-btn" type="button" data-i18n="hero.index.clearid">Clear</button>
    </div>

    <div id="idLookupResults"><p class="muted" data-i18n="common.noresults">No results yet.</p></div>
  </section>

  <div id="banCardModal" class="ban-card-modal" hidden>
    <div class="ban-card-backdrop" data-ban-card-close></div>
    <section class="ban-card-dialog" role="dialog" aria-modal="true" aria-labelledby="banCardTitle" tabindex="-1">
      <div class="ban-card-header">
        <h2 id="banCardTitle">Permanent Ban Card</h2>
        <button class="ban-card-close secondary-btn" type="button" data-ban-card-close aria-label="Close ban card">Close</button>
      </div>
      <div id="banCardStatus" class="ban-card-status" role="status" aria-live="polite">Loading card data…</div>
      <canvas id="banCardCanvas" width="1200" height="675" aria-label="Generated permanent ban card preview" hidden></canvas>
      <div class="ban-card-actions">
        <button id="downloadBanCardBtn" type="button" disabled>Download PNG</button>
      </div>
    </section>
  </div>
</body>
</html>
